[package]
name = "tulong_scholar"
version = "0.1.0"
edition = "2021"
description = "On-chain scholarship disbursement system built on Stellar Soroban"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"        # Optimize for binary size (smallest WASM)
overflow-checks = true # Catch arithmetic panics in release builds
debug = 0
strip = "symbols"
lto = true
codegen-units = 1

[profile.release-with-logs]
inherits = "release"
debug-assertions = true